services:
  postgres:
    image: postgres:16-alpine
    container_name: dentai-postgres
    environment:
      POSTGRES_DB: clinic_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic_management"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: dentai-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  auth:
    image: supabase/gotrue:v2.190.0
    container_name: dentai-auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/clinic_management?search_path=auth
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: dentai-local
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@dentai.local
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: dentAI
    ports:
      - "9999:9999"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dentai-backend
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clinic_management
      JWT_SECRET: dentai-local-dev-secret
      JWT_ISSUER: dentai-local
      JWT_AUDIENCE: authenticated
      AUTH_MODE: supabase
      SUPABASE_AUTH_URL: http://auth:9999
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM_EMAIL: no-reply@dentai.local
      SMTP_FROM_NAME: dentAI
      CORS_ORIGIN: http://localhost:5173
      TRUST_PROXY: 0
      SEED_DEMO_EMAIL: admin@dentai.local
      SEED_DEMO_PASSWORD: Password123!
    command: sh -c "npm run db:push && npm run db:seed && npx tsx src/server.ts"
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
